name: YZ 3D Video APK Derle

# YZ destekli 3D video uygulamasını test eder, derler ve
# doğrudan indirilebilir bir APK olarak Releases'e koyar.

on:
  push:
    paths:
      - 'android-yz-3d-video/**'
      - '.github/workflows/android-3d-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # APK'yı Releases'e yükleyebilmek için

concurrency:
  group: yz3d-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-yz-3d-video

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Birim testleri
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Test raporunu yükle (hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yz3d-test-raporu
          path: android-yz-3d-video/app/build/reports/tests/

      - name: APK'yı anlaşılır bir adla kopyala
        run: cp app/build/outputs/apk/debug/app-debug.apk yz-3d-video.apk

      - name: APK'yı Release olarak yayınla (doğrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-3d-latest
          name: YZ 3D Video (son sürüm)
          body: |
            YZ destekli 3D video uygulamasının en son debug APK'sı.
            Tablette yz-3d-video.apk dosyasına dokunup kurabilirsin.
            İlk açılışta Ayarlar'dan Gemini API anahtarını gir.
          prerelease: false
          make_latest: false
          files: android-yz-3d-video/yz-3d-video.apk
